name: ci

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  checks:
    name: checks (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies from the lock file, with the service extra (compiles the C++ extension)
        run: uv sync --locked --all-extras

      # Formatting output differs between clang-format versions, so it is checked on one platform.
      - name: C++ format check
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --dry-run -Werror $(git ls-files 'cpp/*.hpp' 'cpp/*.cpp')

      - name: C++ unit tests
        run: |
          cmake -S . -B build/cpp -DLOBX_BUILD_TESTS=ON
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  sanitizers:
    name: C++ sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the C++ tests under sanitizers
        run: |
          cmake -S . -B build/san -DLOBX_BUILD_TESTS=ON -DLOBX_SANITIZE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/san
          ctest --test-dir build/san --output-on-failure

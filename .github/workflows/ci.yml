name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies from the lock file (this compiles the C++ extension)
        run: uv sync --locked

      - name: C++ format check
        run: |
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --dry-run -Werror $(git ls-files 'cpp/*.hpp' 'cpp/*.cpp')

      - name: C++ unit tests
        run: |
          cmake -S . -B build/cpp -DLOBX_BUILD_TESTS=ON
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

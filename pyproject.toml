[build-system]
requires = ["scikit-build-core==1.1.1", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lobx"
version = "0.1.0"
description = "Limit-order-book exchange simulator with an ML-driven trade execution agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
]

[project.scripts]
lobx = "lobx.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.169.4",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/lobx"]
cmake.version = ">=3.18"
build-dir = "build/{wheel_tag}"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Markdown files hold illustrative pseudo-code (AGENTS.md); do not reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes, I: import sorting, B: bugbear, UP: pyupgrade,
# SIM: simplifications, N: naming, D: docstrings on public items (see AGENTS.md).
select = ["E", "F", "I", "B", "UP", "SIM", "N", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N806"]
# Machine learning code names the feature matrix X, by long convention (scikit-learn, LightGBM).
"src/lobx/ml/**" = ["N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# scikit-learn and LightGBM ship no complete type information.
module = ["sklearn.*", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

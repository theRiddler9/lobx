[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobx"
version = "0.1.0"
description = "Limit-order-book exchange simulator with an ML-driven trade execution agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.169.4",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
